[project]
name = "book-lamp"
version = "0.1.0"
description = "Reading history."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3",
    "alembic>=1.18",
    "click>=8.4",
    "Flask>=3.1",
    "python-dotenv>=1.2",
    "requests>=2.34",
    "gunicorn>=26.0",
    "google-auth>=2.54.0",
    "openai>=2.41.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=7.1",
    "black>=26.5",
    "isort>=8.0",
    "mypy>=2.1",
    "bandit>=1.9",
    "pbr>=7.0",
    "ruff>=0.15.17",
    "pre-commit>=4.6",
    "types-requests>=2.33",
    "pytest-docker>=3.2",
    "google-api-python-client>=2.197",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=7.1",
    "black>=26.5",
    "isort>=8.0",
    "mypy>=2.1",
    "bandit>=1.9",
    "pbr>=7.0",
    "ruff>=0.15.17",
    "pre-commit>=4.6",
    "types-requests>=2.33",
    "pytest-docker>=3.2",
    "google-api-python-client>=2.197",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
exclude = [".venv"]

[tool.ruff.lint]
ignore = ["E203"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = "(^\\.venv/|^tests/fixtures/)"

[[tool.mypy.overrides]]
module = "googleapiclient.*"
ignore_missing_imports = true
