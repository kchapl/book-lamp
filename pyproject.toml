[project]
name = "book-lamp"
version = "0.1.0"
description = "Reading history."
readme = "README.md"
requires-python = "==3.13.13"
dependencies = [
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
    "alembic==1.18.4",
    "click==8.4.1",
    "Flask==3.1.3",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "gunicorn==26.0.0",
    "google-auth==2.53.0",
    "openai==2.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "isort==8.0.1",
    "mypy==2.1.0",
    "bandit==1.9.4",
    "pbr==7.0.3",
    "ruff==0.15.15",
    "pre-commit==4.6.0",
    "types-requests==2.33.0.20260518",
    "pytest-docker>=3.2.0",
    "google-api-python-client==2.197.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "isort==8.0.1",
    "mypy==2.1.0",
    "bandit==1.9.4",
    "pbr==7.0.3",
    "ruff==0.15.15",
    "pre-commit==4.6.0",
    "types-requests==2.33.0.20260518",
    "pytest-docker>=3.2.0",
    "google-api-python-client==2.197.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
exclude = [".venv"]

[tool.ruff.lint]
ignore = ["E203"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = "(^\\.venv/|^tests/fixtures/)"

[[tool.mypy.overrides]]
module = "googleapiclient.*"
ignore_missing_imports = true
