# All hooks run the tools pinned in uv.lock, via `uv run`, so a hook can never
# use a different version from the one you run by hand. Run `uv sync` first.
repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]

      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]

      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
        args: [--fix]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
