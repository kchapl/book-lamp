name: Clear Stale Dependencies
on: workflow_dispatch # Allows manual triggering

permissions:
  contents: write
  security-events: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Force Clear Snapshot
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dependency-graph/snapshots \
            -d '{"version": 0, "job": {"id": "clear", "correlator": "clear"}, "sha": "${{ github.sha }}", "ref": "${{ github.ref }}", "detector": {"name": "poetry", "version": "0.0.0", "url": "https://github.com"}, "scanned": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'", "manifests": {}}'
