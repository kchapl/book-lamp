version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      action-updates:
        patterns:
          - "*"
          
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      npm-minor-and-patch-updates:
        update-types:
          - minor
          - patch
          
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    groups:
      uv-minor-and-patch-updates:
        update-types:
          - minor
          - patch
