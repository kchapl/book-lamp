version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 10
      groups:
        all-dependencies:
          patterns:
            - "*"
          
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 10
      groups:
        all-dependencies:
          patterns:
            - "*"
          
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 10
      groups:
        all-dependencies:
          patterns:
            - "*"
